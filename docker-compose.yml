services:

  db:
    image: postgres:16
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: velib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: velib
    ports:
      - 5432:5432
volumes:
 pgdata:
   
      
